<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="Adams Daktechniek">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CC27A"/>
      <stop offset="100%" stop-color="#2E7D45"/>
    </linearGradient>
  </defs>

  <!-- Roof silhouette -->
  <g fill="#ffffff">
    <polygon points="300,40 470,170 430,170 300,80 170,170 130,170"/>
    <!-- Roof tiles / corrugated lines on the right slope -->
    <g stroke="#ffffff" stroke-width="6" opacity="0.95">
      <line x1="310" y1="86"  x2="455" y2="170"/>
      <line x1="325" y1="92"  x2="455" y2="160"/>
      <line x1="340" y1="98"  x2="455" y2="150"/>
      <line x1="355" y1="104" x2="455" y2="140"/>
      <line x1="370" y1="110" x2="455" y2="130"/>
      <line x1="385" y1="116" x2="455" y2="120"/>
    </g>
  </g>

  <!-- Green leaf accent -->
  <g transform="translate(238,108) rotate(-18)">
    <path d="M0,30 C0,8 18,-10 40,-10 C44,12 38,32 22,42 C12,48 4,44 0,30 Z" fill="url(#leafGrad)"/>
    <path d="M2,30 C12,22 28,14 38,-6" stroke="#1f5a30" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="240"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="74"
        letter-spacing="6"
        fill="#ffffff">ADAMS</text>

  <!-- Sub-mark with side rules -->
  <g>
    <line x1="120" y1="272" x2="200" y2="272" stroke="#ffffff" stroke-width="2"/>
    <line x1="400" y1="272" x2="480" y2="272" stroke="#ffffff" stroke-width="2"/>
    <text x="300" y="280"
          text-anchor="middle"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-weight="600"
          font-size="26"
          letter-spacing="10"
          fill="#ffffff">DAKTECHNIEK</text>
  </g>

  <!-- Tagline -->
  <text x="300" y="320"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="14"
        letter-spacing="6"
        fill="#9aa0a6">KWALITEIT  ·  VAKMANSCHAP  ·  DUURZAAM</text>
</svg>
