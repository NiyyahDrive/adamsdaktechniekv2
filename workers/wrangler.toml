# Cloudflare Worker — Dakgids leadmagnet
# Deploy: `wrangler deploy` (vereist `wrangler login` met het Adams/Cloudflare-account)
# API-key zetten (eenmalig, wordt secret): `wrangler secret put MAILERLITE_API_KEY`

name = "adams-dakgids"
main = "dakgids-worker.js"
compatibility_date = "2026-07-01"

# Route op het bestaande api-subdomein (zone moet in hetzelfde CF-account zitten)
routes = [
  { pattern = "api.adamsdaktechniek.nl/dakgids", zone_name = "adamsdaktechniek.nl" }
]

[vars]
# MailerLite groeps-ID's — invullen na aanmaken van de groepen (zie HANDOVER)
GROUP_DAKGIDS_OPTIN = "197590358470690473"
GROUP_DAKGIDS_ONLY = "197590382382416910"
